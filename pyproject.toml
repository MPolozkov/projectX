[project]
name = "patres"
version = "0.1.0"
description = ""
authors = [
    {name = "Максим Полозков",email = "pipl82308@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry.dependencies]
    fastapi = {version = ">=0.115.12,<0.116.0", extras = ["standart"]}
    uvicorn = {version = ">=0.34.3,<0.35.0"}
    sqlalchemy = {version = ">=2.0.41,<3.0.0"}
    psycopg2-binary = {version = ">=2.9.10,<3.0.0"}
    python-jose = {version =">=3.5.0,<4.0.0"}
    passlib =  {version = ">=1.7.4,<2.0.0", extras =["bcrypt"]}
    pydantic = {version = ">=2.11.7,<3.0.0"}
timedelta = "^2020.12.3"
crud = "^0.1"
routers = "^0.10.1"
email-validator = "^2.2.0"
requests = "^2.32.4"
httpx = "^0.28.1"


[tool.poetry]
packages = [{include = "patres", from = "src"}]


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.16.0"
black = "^25.1.0"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
#no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
